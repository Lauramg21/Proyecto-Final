<div class="container-table">
  <h2>Listado Secciones</h2>
  
  <div class="container-top">
  <div class="filtro">
    <p>Buscar: </p>
    <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar..." class="search-box">
  </div>
  <!-- Botón de Añadir -->
  <div class="addUser">
    <button (click)="openModal()">Añadir +</button>
  </div>
</div>
<!-- Tabla de usuarios -->
<table>
  <thead>
    <tr>
      <th>Seccion</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
  <tr *ngFor="let seccion of paginatedSecciones">
    <td>{{ seccion.Seccion }}</td>
    <td>{{ getEstado(seccion.Estado) }}</td>
    <div class="botones">
      <button class="edit" (click)="openModal(seccion)">
        <i class="fas fa-edit"></i>
      </button>
      <button class="delete" (click)="deleteSeccion(seccion)">
        <i class="fas fa-trash" style="color: red"></i>
      </button>
    </div>
  </tr>
</tbody>
</table>

<div class="pagination-controls">
    <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">Anterior</button>
    <button *ngFor="let page of [].constructor(totalPages); let i = index" 
      (click)="changePage(i + 1)" [class.active]="currentPage === i + 1">
      {{ i + 1 }}
    </button>
    <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">Siguiente</button>
  </div>
</div>

<!-- Modal para editar o añadir usuario -->
<div class="modal" [ngClass]="{ 'show': isEditModalOpen }">
  <div class="modal-content">
    <div class="title">
      <span class="close" (click)="closeModal()">&times;</span>
      <h3>{{ isAddMode ? 'Añadir Seccion' : 'Editar Seccion' }}</h3> <!-- Título dinámico -->
    </div>
    <div class="campos">
      <div class="campo">
        <label>Seccion:</label>
        <input type="text" [(ngModel)]="selectedSeccion.Seccion">
      </div>
    </div>
    <div class="botones-modal">
      <button class="save" (click)="saveSeccion()">Guardar</button>
    </div>
  </div>
</div>
